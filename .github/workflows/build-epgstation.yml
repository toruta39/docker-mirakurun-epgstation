name: Build and push epgstation

on:
  push:
    branches: [v2-rpi]
    paths:
      - 'epgstation/debian.Dockerfile'
      - '.github/workflows/build-epgstation.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          echo "value=$(grep '^FROM' epgstation/debian.Dockerfile | sed 's/.*epgstation:\(v[^-]*\).*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./epgstation
          file: ./epgstation/debian.Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/toruta39/epgstation:latest
            ghcr.io/toruta39/epgstation:${{ steps.version.outputs.value }}
