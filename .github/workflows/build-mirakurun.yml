name: Build and push mirakurun arm32v7

on:
  push:
    branches: [v2-rpi]
    paths:
      - 'mirakurun/Dockerfile'
      - 'mirakurun/MIRAKURUN_VERSION'
      - '.github/workflows/build-mirakurun.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          echo "value=$(cat mirakurun/MIRAKURUN_VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./mirakurun
          platforms: linux/arm/v7
          push: true
          build-args: |
            MIRAKURUN_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/toruta39/mirakurun:latest-arm32v7
            ghcr.io/toruta39/mirakurun:${{ steps.version.outputs.value }}-arm32v7
